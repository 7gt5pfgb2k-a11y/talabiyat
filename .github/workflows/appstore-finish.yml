# بيختار أحدث build، بيعبّي التصنيف العمري، وبيحط السعر مجاني — بدون إرسال للمراجعة.
name: App Store finish listing

on:
  push:
    branches: [ios-build]
    paths: [ios-app/fastlane/finish_listing.rb, .github/workflows/appstore-finish.yml]
  workflow_dispatch:

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document
      - name: Write API key file (never printed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc.json"), "w"))
          PY
          chmod 600 "$RUNNER_TEMP/asc.json"
      - name: Finish listing
        env:
          ASC_KEY_JSON: ${{ runner.temp }}/asc.json
        run: ruby ios-app/fastlane/finish_listing.rb
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.json"
