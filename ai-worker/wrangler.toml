name = "talabiyat-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# حد أقصى: 20 طلب بالدقيقة لكل جهاز (حماية من الاستعمال الزايد)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

